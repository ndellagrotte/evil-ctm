pluginManagement {
    repositories {
        maven {
            url = 'https://maven.cleanroommc.com'
        }
        gradlePluginPortal()
    }
}

plugins {
    // Adds Maven Central, Cleanroom's Maven and Mojang's libraries to the project (CleanroomGradle's settings plugin).
    id 'com.cleanroommc.cleanroomgradle.settings' version '0.22.0'
    // Automatic toolchain provisioning
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'evil-ctm'
