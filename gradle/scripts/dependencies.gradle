def demonicaJar = file(project.property('demonica_jar'))
if (!demonicaJar.isFile()) {
    throw new GradleException("Demonica jar not found at ${demonicaJar}; build Demonica or set -Pdemonica_jar=<absolute path>")
}

dependencies {
    compileOnly "com.cleanroommc:sponge-mixin:0.20.13+mixin.0.8.7"
    if (enable_lwjglx.toBoolean()) {
        compileOnly "com.cleanroommc:lwjglx:1.0.0"
    }
    // S20 API + DemonicaRuntime/QuarantineGuard/ShaderBlockContexts/compat reads. Remapped like any mod jar.
    if (project.findProperty('demonica_unremapped')?.toString()?.toBoolean()) {
        compileOnly files(demonicaJar)
    } else {
        modCompileOnly files(demonicaJar)
    }
    if (project.hasProperty('celeritas_jar')) {
        compileOnly files(project.property('celeritas_jar'))
    } else {
        modCompileOnly "org.embeddedt:celeritas-forge-mc12.2:${celeritas_version}"
    }
    // CeleritasBlockAccess extends Fluidlogged API interfaces; javac needs them to resolve the type.
    if (project.hasProperty('fluidlogged_jar')) {
        compileOnly files(project.property('fluidlogged_jar'))
    } else {
        modCompileOnly("maven.modrinth:fluidlogged-api:${fluidlogged_api_version}") {
            transitive = false
        }
    }
}
