# Gradle
org.gradle.configuration-cache = true
org.gradle.jvmargs = -Xmx3G

# Cleanroom
# CleanroomGradle + Conventions only work with Cleanroom 0.7.0 and above
cleanroom_version = 0.7.4-alpha

# Mod Information
# The version is computed from git tags by Versioning, run `gradlew -q printVersion` to see it
# Tag `v1.0.0` on main to release it. A suffix on the tag picks the release type:
#   1.0.0-alpha    = alpha
#   1.0.0-beta     = beta
#   1.0.0-rc       = release candidate
#   1.0.0-release  = release, same as the bare `1.0.0`
# Untagged builds inherit the type of the highest staged tag in the same major version,
# else beta below 1.0.0 and release from there on
root_package = com
mod_id = evilctm
mod_name = Evil CTM

# Mod Metadata (Optional)
# Every property in the two sections above and below is a Token Envoy token, see tokens.properties
mod_description = OptiFine/MCPatcher connected, overlay and emissive textures (plus CTM-mod metadata) for Cleanroom 1.12.2, rendered through Demonica's S20 block quad transformer. Requires Demonica; turns on and locks its fast block renderer.
mod_url = https://github.com/ndellagrotte/evil-ctm
mod_update_json =
# Delimit authors with commas. When set, they also become the copyright holder in LICENSE and HEADER
mod_authors = Nicholas DellaGrotte
mod_credits = Based on CleanContinuity (DHJComical), NeoContinuity (Argon4W) and Continuity (PepperCode1); LGPL-3.0
mod_logo_path =
mod_issue_tracker = https://github.com/ndellagrotte/evil-ctm/issues

# Run Configurations
# Delimit multiple JVM arguments with spaces
minecraft_username = Developer
extra_jvm_args =

# Access Transformers (Optional)
# File names under src/main/resources/META-INF, delimited with spaces. SRG names: CleanroomGradle applies the file to
# the SRG-named Minecraft jar before the userdev renames it, and FML reads it from the built jar (FMLAT).
access_transformers = evilctm_at.cfg

# Coremod (Optional)
# Fully-qualified name of the class implementing IFMLLoadingPlugin. Evil CTM has no coremod: its mixins are declared
# by the jar manifest (MixinConfigs), in runClient too, which runs the mod from its jar.
coremod_plugin_class =
coremod_includes_mod = true

# Mixin
# Name of the refmap the Mixin config (src/main/resources/mixins.evilctm.json) points at.
# Setting it adds the Mixin annotation processors and puts the refmap in both jars
cg.userdev.refmap = mixins.evilctm.refmap.json

# Publishing (Optional), ran by the release workflow through `publishMods`
# Provide secrets: CURSEFORGE_TOKEN, MODRINTH_TOKEN
# The CurseForge project ID is the numerical ID and not the slug
curseforge_project_id =
modrinth_project_id =

# Conventions (https://github.com/CleanroomMC/Conventions#configuration)
# One of: free (MIT), open (LGPLv3), visible (CleanroomMC License), none
# Run `gradlew extractConventions applyLicenseHeader` after changing it
conventions.license = open
conventions.javaMajor = 25
# Code Style
# When true, `gradlew build` fails on a violation. The `Apply` tasks work either way
# Checkstyle, with the rules in checkstyle.xml. It also requires the license header on every Java file
enable_checkstyle = false
# FormatJ and ClearSkies, fix with `gradlew clearSkiesApply formatJavaApply`. Off: the tree is tab-indented and a
# reformat is a separate step.
enable_formatting = false

# The branch release tags are cut from
versioning.releaseBranch = main

# Dependencies (compile only; none is distributed with Evil CTM)
# Demonica, from the assets of its GitHub release v<version> (https://github.com/ndellagrotte/Demonica/releases).
# -PdemonicaJar=<path> compiles against, and runs, a local SRG-named Demonica jar instead (a Demonica build/libs jar).
demonica_version = 0.9.0
# Celeritas, the build Demonica <demonica_version> pins (its gradle.properties), from maven.outlands.top.
celeritas_version = 2.5.0-autobuild.d94ec1e5
# Fluidlogged API: CeleritasBlockAccess extends its interfaces, so javac needs them to resolve the type.
fluidlogged_api_version = 3.0.6
# runClient loads Demonica (into run/client/mods) and a Celeritas *dev* jar (on -Dcrl.dev.extrapath): a raw Celeritas
# cannot run in dev because its mixins have no refmap. By default both the dev jar and the generated Celeritas pin that
# makes Demonica accept it come from a built Demonica checkout next door (-PdemonicaCheckout=<dir>, default
# ../Demonica); -PceleritasDevJar=<jar> and -PdemonicaPinDir=<dir> name them one by one. Without a dev jar, runClient
# starts without Demonica and Evil CTM only reports its render-path warning. build.gradle has the details.
