name: Release

# Tags are v-prefixed (v0.1.1); Versioning accepts both forms.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  release:
    uses: CleanroomMC/Conventions/.github/workflows/release.yml@1.4.1
    with:
      publish-maven: false
      # Needs curseforge_project_id or modrinth_project_id in gradle.properties, and the matching token secret
      publish-mods: false
    secrets: inherit
