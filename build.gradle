/*
 * Evil CTM: OptiFine/MCPatcher connected textures for Minecraft 1.12.2 on Cleanroom 0.7 (Java 25), rendered through
 * Demonica's S20 block quad transformer.
 *
 * The toolchain is CleanroomGradle and CleanroomMC's Conventions, as in Demonica. cleanroom.userdev(cleanroom_version)
 * supplies the MCP-named Minecraft and Cleanroom workspace, with evilctm_at.cfg applied; the mods Evil CTM compiles
 * against (Demonica, Celeritas, Fluidlogged API) are declared through deobf(...), which renames their SRG jars to MCP
 * for the compile and test classpaths only. None of them is distributed with Evil CTM. Conventions computes the version
 * from git tags (Versioning: `./gradlew -q printVersion`), sets the toolchain, JUnit and the reproducible jars, and
 * fills mcmod.info's and Reference's @{TOKEN}s (Token Envoy, tokens.properties). `jar` writes the MCP-named jar for dev
 * use; the distributed jar is `reobfJar`'s SRG rename of it in build/libs.
 *
 * The dev client (runClient) runs the mod from its MCP-named jar, with Demonica's raw SRG jar (which Cleanroom remaps
 * as it loads it) in run/client/mods and a Celeritas dev jar (Demonica's remapCeleritasForDev output, -PceleritasDevJar
 * or ../Demonica/build/celeritas-dev) on -Dcrl.dev.extrapath; see the cleanroom.runs block for why each goes where it
 * does. Without a Celeritas dev jar it starts without Demonica (gradle.properties).
 */
plugins {
    id 'java'
    id 'com.cleanroommc.cleanroomgradle'
    id 'com.cleanroommc.conventions' version '1.4.1'
}

group = root_package

base {
    archivesName = mod_id
}

conventions {
    author = mod_authors
    repositoryUrl = mod_url
}

def accessTransformerNames = access_transformers.tokenize()
def mixinConfig = "mixins.${mod_id}.json".toString()

// -PdemonicaJar=<path>: a local SRG-named Demonica jar (Demonica's build/libs) in place of the GitHub release.
def demonicaJar = project.findProperty('demonicaJar')?.toString()
// -PceleritasDevJar=<path>: Demonica's remapCeleritasForDev output, which runClient loads next to Demonica. Falls back
// to a Demonica checkout next door; null when neither exists, and runClient then starts without Demonica.
def demonicaCheckout = file(project.findProperty('demonicaCheckout')?.toString() ?: '../Demonica')
def defaultCeleritasDevJar = new File(demonicaCheckout, "build/celeritas-dev/celeritas-forge-mc12.2-${celeritas_version}-dev.jar")
def celeritasDevJar = project.findProperty('celeritasDevJar')?.toString()
        ?: (defaultCeleritasDevJar.isFile() ? defaultCeleritasDevJar.absolutePath : null)
// The Celeritas pin that Demonica's build generates next to the dev jar (generateCeleritasPin): the only copy that
// carries dev_sha256, the dev jar's hash, which Demonica's jars drop. -PdemonicaPinDir=<dir> names another.
def demonicaPinDir = file(project.findProperty('demonicaPinDir')?.toString() ?: new File(demonicaCheckout, 'build/generated/celeritas-pin').path)

configurations {
    // Mods compiled against, as MCP-named jars (deobf). Visible when the tests compile, absent at test runtime: the
    // tests must never load DemonicaBridge, CtmQuadTransformer or EvilCtmClient.preInit.
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    testCompileOnly.extendsFrom(modCompileOnly)
    // The jars the dev client loads besides the mod's own: Demonica's raw (SRG-named) jar, which Cleanroom remaps as it
    // loads it (devDemonica, synced into run/client/mods), and the Celeritas dev jar (devRuntimeMods, on the
    // extrapath). They extend nothing and nothing extends them: the raw jars stay off the compile and test classpaths.
    devDemonica {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
    devRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

repositories {
    // Celeritas's 1.12.2 mod, built from upstream commits by kappa-maintainer/Celeritas-auto-build.
    exclusiveContent {
        forRepository {
            maven {
                name = 'CeleritasAutoBuild'
                url = 'https://maven.outlands.top/releases'
            }
        }
        filter {
            includeModule('org.embeddedt', 'celeritas-forge-mc12.2')
        }
    }
    // Demonica's jar, from the assets of its GitHub release v<version>.
    exclusiveContent {
        forRepository {
            ivy {
                name = 'DemonicaReleases'
                url = 'https://github.com/ndellagrotte/Demonica/releases/download'
                patternLayout { artifact 'v[revision]/[artifact]-[revision](-[classifier]).[ext]' }
                metadataSources { artifact() }
            }
        }
        filter {
            includeGroup('com.demonica')
        }
    }
    // Modrinth's Maven: Fluidlogged API.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup('maven.modrinth')
        }
    }
}

dependencies {
    // The Minecraft and Cleanroom workspace (MCP names), with Evil CTM's access transformer applied. It brings Mixin,
    // MixinExtras, lwjgly (the LWJGL2 API, org.lwjgl.util.vector) and the rest of Cleanroom's libraries.
    implementation cleanroom.userdev(cleanroom_version) {
        accessTransformers.from(accessTransformerNames.collect { "src/main/resources/META-INF/$it" })
    }
    // Demonica: the S20 API, DemonicaRuntime, QuarantineGuard, ShaderBlockContexts and the compat reads.
    if (demonicaJar) {
        modCompileOnly deobf(files(demonicaJar))
        devDemonica files(demonicaJar)
    } else {
        modCompileOnly deobf("com.demonica:Demonica:${demonica_version}")
        devDemonica "com.demonica:Demonica:${demonica_version}"
    }
    // Celeritas: ChunkBuilderMeshingTask (the extra-layer mixin), CeleritasBlockAccess and the S20 quad types.
    modCompileOnly(deobf("org.embeddedt:celeritas-forge-mc12.2:${celeritas_version}")) {
        transitive = false
    }
    // CeleritasBlockAccess extends Fluidlogged API's interfaces, so javac needs them to resolve the type.
    modCompileOnly(deobf("maven.modrinth:fluidlogged-api:${fluidlogged_api_version}")) {
        transitive = false
    }
    if (celeritasDevJar) {
        devRuntimeMods files(celeritasDevJar)
    }
}

/*
 * The dev client. Cleanroom loads mods from -Dcrl.dev.extrapath as in production, but reads a mod's Mixin config only
 * from a jar (CleanMix: "Mixin config does not reside in a jar file") and extracts a jar's nested libraries
 * (ContainedDeps) only from the mods directory. So the client runs
 *  - Evil CTM from its MCP-named jar (`jar`, build/devlibs) on the extrapath, its MixinConfigs and FMLAT manifest
 *    attributes read as in production; the main output stays off the JavaExec classpath, where CleanroomGradle puts the
 *    runtime classpath, as a class loaded by both would fail with a LinkageError;
 *  - Demonica from run/client/mods (syncDevMods, which owns that directory), so its glsl-transformer and ANTLR jars are
 *    extracted next to it;
 *  - the Celeritas dev jar on the extrapath. Demonica's quarantine guard (QuarantineGuard) accepts it only when the
 *    pin it reads (META-INF/demonica/celeritas-pin, first match on the launch class loader) carries that jar's hash as
 *    dev_sha256, which Demonica's jars drop and only its build's generated pin keeps: that directory goes on the
 *    JavaExec classpath, ahead of the mods. Without it (another Celeritas dev jar than the checkout's, or no checkout)
 *    Demonica still loads but rejects Celeritas, and Evil CTM reports CELERITAS_REJECTED instead of rendering.
 */
def devModsDir = layout.projectDirectory.dir('run/client/mods')
def syncDevMods = tasks.register('syncDevMods', Sync) {
    group = 'cleanroom'
    description = "Puts Demonica's jar into run/client/mods for runClient (the directory holds nothing else)."
    from configurations.devDemonica
    into devModsDir
}

cleanroom {
    runs {
        client {
            configure {
                username = minecraft_username
                jvmArgs extra_jvm_args.tokenize()
                def modJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
                dependsOn 'jar'
                def builtInClasspath = files(classpath.from)
                def modOutputs = sourceSets.main.output
                classpath = builtInClasspath.filter { !modOutputs.contains(it) }
                def extraPathFiles = files(modJar)
                if (celeritasDevJar) {
                    extraPathFiles = extraPathFiles + configurations.devRuntimeMods
                    dependsOn syncDevMods
                    def pinFile = new File(demonicaPinDir, 'META-INF/demonica/celeritas-pin')
                    if (pinFile.isFile() && pinFile.text.contains('dev_sha256=')) {
                        classpath = files(demonicaPinDir) + classpath
                    } else {
                        doFirst {
                            logger.warn("runClient: no generated Celeritas pin with dev_sha256 at ${pinFile} " +
                                    '(-PdemonicaPinDir, or build the Demonica checkout), so Demonica will reject the ' +
                                    'Celeritas dev jar and Evil CTM will not render.')
                        }
                    }
                } else {
                    doFirst {
                        logger.warn('runClient: no Celeritas dev jar (-PceleritasDevJar or ../Demonica/build/celeritas-dev), ' +
                                'so the client starts without Demonica. Evil CTM will report its render-path warning; ' +
                                'this run only checks that the Mixin config and the access transformer apply.')
                        devModsDir.asFile.deleteDir()
                    }
                }
                systemProperty 'crl.dev.extrapath', extraPathFiles.elements.map { jars ->
                    jars.collect { it.asFile.absolutePath }.join(File.pathSeparator)
                }
            }
        }
    }
}

// Foundation (Cleanroom's class loading) needs it in a dev run (from the mod template: "fundamental Foundation issue").
tasks.withType(JavaExec).configureEach {
    systemProperty 'foundation.loadsall', 'true'
}

// Client-side only: there is nothing to run on a server.
tasks.named('runServer').configure {
    enabled = false
}

// mcmod.info's and Reference's @{TOKEN}s (tokens.properties). Token Envoy filters every processed resource and
// compiled string.
tokenEnvoy {
    set 'MOD_VERSION', project.version
    set 'MOD_AUTHORS', mod_authors.tokenize(',')*.trim().join('", "')
    set file('tokens.properties')
}

jar {
    // The MCP-named jar, for dev use only (evilctm-<version>-mcp.jar). build/libs holds only what is distributed:
    // reobfJar's SRG jar, the sources jar and the javadoc jar.
    destinationDirectory = layout.buildDirectory.dir('devlibs')
    manifest {
        attributes 'ModType': 'CRL', 'MixinConfigs': mixinConfig
        if (accessTransformerNames) {
            attributes 'FMLAT': accessTransformerNames.join(' ')
        }
    }
    // The licence texts and notices, as META-INF/licenses/evilctm/.
    from(files('LICENSE', 'NOTICE.md')) {
        into "META-INF/licenses/${mod_id}"
    }
}

// Forge's renamer adds fernflower_abstract_parameter_names.txt (a decompiler hint) to a jar whose abstract methods
// take parameters; the distributed jar has no use for it.
tasks.named('reobfJar').configure {
    additionalArgs.add('--disable-abstract-param')
}

// Conventions names CleanroomMC as every jar's vendor; Evil CTM's are its author's.
tasks.withType(Jar).configureEach {
    manifest.attributes(
        'Implementation-Vendor': mod_authors,
        'Specification-Vendor': mod_authors,
        'Implementation-Vendor-Id': root_package
    )
}

tasks.withType(Checkstyle).configureEach {
    enabled = enable_checkstyle.toBoolean()
}

tasks.matching { it.name in ['clearSkiesCheck', 'formatJavaCheck'] }.configureEach {
    enabled = enable_formatting.toBoolean()
}
